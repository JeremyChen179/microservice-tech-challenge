<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pet Microservice Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        img { max-width: 400px; height: auto; border-radius: 4px; margin-top: 15px; border: 1px solid #ddd; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Random Pet Photo Microservice</h2>
        <button onclick="fetchNewPhoto()">Fetch New Random Photo</button>
        <p id="meta"></p>
        <div>
            <img id="photo" src="/api/photos/latest/image" alt="Latest Pet Photo" onerror="this.style.display='none'"/>
        </div>
    </div>

    <script>
        async function fetchNewPhoto() {
            document.getElementById('meta').innerText = "Fetching from APIs and saving to SQLite...";
            let res = await fetch('/api/photos/fetch', { method: 'POST' });
            if(res.ok) {
                let data = await res.json();
                document.getElementById('meta').innerText = "Loaded from: " + data.source;
                // Force image reload by updating cache-busting query param
                document.getElementById('photo').style.display = 'block';
                document.getElementById('photo').src = '/api/photos/latest/image?t=' + new Date().getTime();
            } else {
                document.getElementById('meta').innerText = "Error fetching photo.";
            }
        }
    </script>
</body>
</html>
